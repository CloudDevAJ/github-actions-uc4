name: Flask CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: test app
        run: python -m pytest

      - name: Start Flask and verify response
        run: |
          python app.py &
          sleep 5
          curl --fail http://127.0.0.1:5000/
